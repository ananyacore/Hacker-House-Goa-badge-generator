<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hacker House Goa — Badge Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="Generate your Hacker House Goa badge and share it with #FrameInGoa">
<link rel="stylesheet" href="/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <p class="eyebrow">// badge generator</p>
  <h1>Hacker House <span>Goa</span></h1>
</header>

<main class="wrap">

  <section class="panel">
    <label>1. Photo</label>
    <div class="photo-row">
      <label class="file-btn" for="photoInput">Choose photo</label>
      <input type="file" id="photoInput" accept="image/*">
      <span class="file-name" id="fileName">No photo yet</span>
    </div>

    <div id="cropperWrap" class="cropper-wrap hidden">
      <canvas id="cropperCanvas"></canvas>
      <p class="drag-hint">Drag to reposition · pinch or use slider to zoom</p>
      <div class="zoom-row">
        <span>−</span>
        <input type="range" id="zoomRange" min="100" max="300" value="100">
        <span>+</span>
      </div>
      <button class="tiny-btn" id="recenterBtn" type="button">Recenter</button>
    </div>

    <label for="name">2. Name</label>
    <input type="text" id="name" maxlength="24" placeholder="Your name">

    <label for="role">Stack / role</label>
    <input type="text" id="role" maxlength="20" placeholder="e.g. Backend, AI/ML, Design">

    <label for="song">Beach song</label>
    <input type="text" id="song" maxlength="40" placeholder="Song — Artist">

    <div class="btn-row">
      <button class="primary" id="downloadBtn">Download badge (PNG)</button>
    </div>
  </section>

  <section class="panel share-panel">
    <label>3. Share to X</label>
    <textarea id="tweetText">Just built my badge at Hacker House Goa 🌴💻 Build yours now at https://hacker-house-goa-badge-generator.vercel.app/ #FrameInGoa</textarea>
    <div class="btn-row">
      <button class="secondary" id="shareBtn">Share directly to X</button>
    </div>
    <p class="status" id="shareStatus"></p>
    <p class="hint">This creates a short link to your badge — when it's pasted into X (or anywhere), the badge image shows up as the link preview.</p>
  </section>

  <section class="preview-section">
    <canvas id="badgeCanvas"></canvas>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
